# Every version is pinned. The build tools are the ones desktop-kit 2.4.0 is built with:
# AGP 9.4.1, Gradle 9.8.2 (gradle/wrapper), Kotlin 2.4.20; tests run on Java 21.
# Compose (BOM 2026.09.00), Navigation and Haze come with the kit at the versions it was built with.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
desktopKit = "2.4.0"
activityCompose = "1.13.0"
# FileProvider. The kit already brings this version; named here because the app uses the class itself.
core = "1.19.1"
# Mail: Angus Mail is the Jakarta Mail implementation (IMAP, SMTP, MIME); it brings the Jakarta Mail and
# Activation APIs it was built with. jsoup cleans the HTML of a message before it is shown.
angusMail = "2.0.5"
jsoup = "1.24.1"
coroutines = "1.11.0"
# The database: Room 3 generates Kotlin through KSP and runs on the SQLite the device has
# (androidx.sqlite's framework driver, released together with this Room).
ksp = "2.3.13"
room = "3.0.3"
sqlite = "2.7.1"
# Sends what waits in the outbox when there is a network, also after the app was closed.
work = "2.12.0"
junit = "4.13.2"
# A mail server inside the tests: IMAP and SMTP on a free local port.
greenmail = "2.1.15"
# The tests of :app, as in the kit: Robolectric 4.17 runs Android 16 (API 36) on Java 21.
robolectric = "4.17"
testCore = "1.7.0"
testExtJunit = "1.3.0"
# The kit's Compose BOM once more, only to name the version of the Compose test artifacts;
# raise it together with the kit.
composeBom = "2026.09.00"

[libraries]
desktop-kit = { module = "com.github.hesaplarimdijital-coder:desktop-kit", version.ref = "desktopKit" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angusMail" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
junit = { module = "junit:junit", version.ref = "junit" }
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-core = { module = "androidx.test:core", version.ref = "testCore" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Never applied (AGP 9 compiles Kotlin itself); declared in the root build file only to pin the Kotlin version.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }
