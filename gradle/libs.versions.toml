# Every version is pinned. The build tools are the ones desktop-kit 2.4.0 is built with:
# AGP 9.4.1, Gradle 9.8.2 (gradle/wrapper), Kotlin 2.4.20; tests run on Java 21.
# Compose (BOM 2026.09.00), Navigation and Haze come with the kit at the versions it was built with.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
desktopKit = "2.4.0"
activityCompose = "1.13.0"
junit = "4.13.2"
# The tests of :app, as in the kit: Robolectric 4.17 runs Android 16 (API 36) on Java 21.
robolectric = "4.17"
testCore = "1.7.0"
testExtJunit = "1.3.0"
# The kit's Compose BOM once more, only to name the version of the Compose test artifacts;
# raise it together with the kit.
composeBom = "2026.09.00"

[libraries]
desktop-kit = { module = "com.github.hesaplarimdijital-coder:desktop-kit", version.ref = "desktopKit" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-core = { module = "androidx.test:core", version.ref = "testCore" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Never applied (AGP 9 compiles Kotlin itself); declared in the root build file only to pin the Kotlin version.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
